name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      # The Kiva CSVs are gitignored (kiva_loans.csv alone is ~196MB), so CI
      # cannot run the analysis. What it can do is guard the leakage check, the
      # funding target and the gender parsing, none of which need the dataset.
      # The leakage guard is the reason this workflow exists: a leaked column
      # raises the model's score rather than breaking it, so it passes every
      # check except this one.
      # requirements-test.txt pins the versions of the recorded run, so a new
      # numpy or pandas release cannot change the result of this job on its own.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest
